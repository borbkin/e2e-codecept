name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 9 * * *' # каждый день в 09:00 UTC (12:00 по МСК)
  workflow_dispatch:

# PRs for the same branch can replace an older run. Every trusted run gets a
# unique group so pushes, schedules, and manual runs never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npm run test:smoke

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-output-smoke
          path: output/
          if-no-files-found: ignore

      - name: Add Playwright traces link to summary
        if: failure()
        run: |
          echo "### ⚠️ Playwright output" >> "$GITHUB_STEP_SUMMARY"
          echo "Failure artifacts are attached to this run. Open a trace at https://trace.playwright.dev." >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    outputs:
      report_available: ${{ steps.upload-allure.outcome == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify network isolation
        run: npm run test:network

      - name: Verify auth reliability
        run: npm run test:reliability

      - name: Verify API helper contracts
        run: npm run test:api

      - name: Verify account cleanup
        run: npm run test:cleanup

      - name: Run regression suite
        run: npm run test:regression

      - name: Generate Allure report
        if: always() && hashFiles('allure-results/**') != ''
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        id: upload-allure
        if: always() && hashFiles('allure-report/**') != '' && (github.event_name == 'pull_request' || (github.repository == 'borbkin/e2e-codecept' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')))
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-output
          path: output/
          if-no-files-found: ignore

      - name: Add Playwright traces link to summary
        if: failure()
        run: |
          echo "### ⚠️ Playwright output" >> "$GITHUB_STEP_SUMMARY"
          echo "Failure artifacts are attached to this run. Open a trace at https://trace.playwright.dev." >> "$GITHUB_STEP_SUMMARY"

      - name: Add Allure report to summary
        if: always() && steps.upload-allure.outcome == 'success'
        run: |
          echo "### Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo 'The `allure-report` artifact is attached to this run.' >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    if: always() && needs.test.result != 'cancelled' && needs.test.outputs.report_available == 'true' && github.repository == 'borbkin/e2e-codecept' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Allure report
        uses: actions/download-artifact@v5
        with:
          name: allure-report
          path: allure-report/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

      - name: Add published Allure report link to summary
        run: |
          echo "### Allure report published" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the published report](https://borbkin.github.io/e2e-codecept/)" >> "$GITHUB_STEP_SUMMARY"
